[project]
name = "myproject"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.1",
    "requests==2.34.2",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "pyarrow",
    "scikit-learn>=1.4",
    "xgboost==2.1.4",
    "plotly==5.24.0",
    "seaborn==0.13.2",
    "statsmodels",
    "ipython",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"